AWSTemplateFormatVersion: '2010-09-09'
Parameters:

  Environment:
    Type: String
    Description: Deployment environment (e.g., dev, test, prod)

  SubnetID:
    Type: String
    Description: "Please Enter The Subnet ID"
    
  AutosysInstanceType:
    Type: String
    Description: AMI for Autosys Instance
    Default: t3.medium

  AMI:
    Type: String
    Default: ami-0abcdef1234567890  # Replace with your preferred AMI

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  AutosysEC2Role:
    Type: string
    Description: IAM Role

  KmsKey:
    Type: string
    Description: "KMS key for EC2"

  AutosysSecurityGroup:
    Type: string
    Description: "Security Group of Autosys Instances"

  AutosysEBSVolume:
    Type: Number
    Description: "EbS volume for Autosys Sever"

  SFTPEBSVolume:
    Type: Number
    Description: "SFTP volume for Autosys Server"

  AutosysBackupPeriod:
    Type: string
    Description: "Tag for creating snapshot for DR"

Resources:
  EC2Instance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          setup:
            - install_autosys
        install_autosys:
          packages:
            yum:
              java-1.8.0-openjdk: []
              unzip: []
          files:
            "/home/ec2-user/install_autosys.sh":
              content: |
                #!/bin/bash
                echo "Installing AutoSys..."
                # Add your AutoSys installation steps here
              mode: '000755'
              owner: ec2-user
              group: ec2-user
          services:
            sysvinit:
              autosys:
                enabled: true
                ensureRunning: true
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Ref AMI
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y aws-cfn-bootstrap
          /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource EC2Instance --configsets setup --region ${AWS::Region}
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}

